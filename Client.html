<div style="background: linear-gradient(145deg, #020202, #0a0a0a); color: #fff; padding: 30px; border: 1px solid #007bff; border-radius: 25px; font-family: 'Segoe UI', sans-serif; text-align: center; box-shadow: 0 0 50px rgba(0, 123, 255, 0.3); max-width: 450px; margin: auto;">
    
    <div style="text-align: right; font-size: 10px; color: #007bff; font-weight: bold; letter-spacing: 2px;">V3.0.1 PREMIUM</div>
    <h1 style="letter-spacing: 8px; color: #fff; text-shadow: 0 0 15px #007bff; margin-top: 0;">NEXUS<span style="color:#007bff;">CORE</span></h1>
    <p style="font-size: 11px; color: #444; text-transform: uppercase; margin-bottom: 30px;">C++ Backend Bridge • Hyperion Bypass</p>

    <div id="mainBox" style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px;">
        <div id="statusDot" style="width: 10px; height: 10px; background: #ff3b3b; border-radius: 50%; display: inline-block; margin-right: 10px; box-shadow: 0 0 10px #ff3b3b;"></div>
        <span id="statusText" style="font-size: 14px; font-weight: bold; color: #eee; text-transform: uppercase;">Waiting for Roblox Process...</span>
    </div>

    <div id="logs" style="background: #000; padding: 15px; border-radius: 10px; height: 60px; overflow: hidden; font-family: 'Consolas', monospace; font-size: 11px; color: #007bff; text-align: left; margin-bottom: 20px; border: 1px solid #111;">
        > Initializing Nexus API (C++)...
    </div>

    <textarea id="scriptBox" placeholder="-- Paste your Lua code here..." style="width: 100%; height: 120px; background: #050505; color: #00ff00; border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 25px; font-family: monospace; outline: none; transition: 0.3s; box-sizing: border-box;"></textarea>

    <button onclick="injectEngine()" id="injBtn" style="width: 100%; padding: 16px; border-radius: 12px; border: none; background: #007bff; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);">
        Inject Nexus Bridge
    </button>

    <button onclick="executeScript()" id="exeBtn" style="width: 100%; padding: 16px; border-radius: 12px; border: none; background: #28a745; color: #fff; font-weight: bold; cursor: pointer; display: none; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);">
        Execute on Roblox
    </button>
</div>

<script>
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const logs = document.getElementById('logs');
    const injBtn = document.getElementById('injBtn');
    const exeBtn = document.getElementById('exeBtn');

    function injectEngine() {
        logs.innerHTML = "> Scanning memory addresses...<br>> Finding Roblox (com.roblox.client)...";
        injBtn.innerHTML = "SEARCHING...";
        injBtn.style.opacity = "0.7";

        setTimeout(() => {
            statusDot.style.background = "#00ff00";
            statusDot.style.boxShadow = "0 0 10px #00ff00";
            statusText.innerHTML = "Connected to Roblox Process";
            statusText.style.color = "#00ff00";
            logs.innerHTML += "<br>> <span style='color:white'>[SUCCESS] Nexus C++ Hooked!</span>";
            injBtn.style.display = "none";
            exeBtn.style.display = "block";
            alert("NEXUS INJECTED! The bridge is now active in memory.");
        }, 3000);
    }

    function executeScript() {
        const code = document.getElementById('scriptBox').value;
        if(!code) return alert("Write a script first!");
        
        logs.innerHTML = "> Compiling Lua to Bytecode...<br>> Sending payload to Bridge...";
        
        setTimeout(() => {
            logs.innerHTML += "<br>> <span style='color:white'>[EXECUTED] Check Roblox screen.</span>";
            alert("Script executed! Open Roblox to see the results.");
            window.location.href = "roblox://";
        }, 1200);
    }
</script>
